    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="index.html">Matador House</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMatador" aria-controls="navbarMatador" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMatador">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro.html"><i class="fa-solid fa-user"></i> Crear Cuenta</a></li>
                        <li class="nav-item"><a class="nav-link active" href="login.html"><i class="fa-solid fa-sign-in"></i> Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Conócenos</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <!-- SECCIÓN ÚNICA DE LOGIN -->
        <section id="seccion-login">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa para ver tu biblioteca de juegos y compras.</p>

            <form class="formulario-login" action="index.html" method="POST">
                <label>Correo electrónico:
                    <input type="email" name="email" required>
                </label>

                <label>Contraseña:
                    <input type="password" name="password" required>
                </label>

                <input class="btn-login" type="submit" value="Entrar a mi cuenta">
            </form>

            <!-- ENLACE A REGISTRO -->
            <div id="enlace-registro">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </section>

    </main>

    <footer>
        <p>Matador House</p>
        <p>© 2026 Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
