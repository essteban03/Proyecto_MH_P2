<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Matador House</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="index.html">Matador House</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMatador"
                    aria-controls="navbarMatador" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMatador">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>
                                Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro.html"><i class="fa-solid fa-user"></i>
                                Crear Cuenta</a></li>
                        <li class="nav-item"><a class="nav-link active" href="login.html"><i
                                    class="fa-solid fa-sign-in"></i> Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Conócenos</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrito.html"><i
                                    class="fa-solid fa-cart-shopping"></i> Mi Carrito</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        
        <section id="seccion-login">
            <h1>Iniciar Sesión</h1>
            <p>Ingresa para ver tu biblioteca de juegos y compras.</p>

            
            <form class="formulario-login" id="form-login" onsubmit="iniciarSesion(event)">
                <label>Correo electrónico:
                    <input type="email" id="login-email" name="email" placeholder="usuario@gmail.com" required>
                </label>

                <label>Contraseña:
                    <input type="password" id="login-password" name="password" placeholder="Tu contraseña" required>
                </label>

                <button class="btn-login" type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar a mi cuenta
                </button>
            </form>

            
            <div id="enlace-registro">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </section>

    </main>

    <footer>
        <p>Matador House</p>
        <p>© 2026 Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="js/storage.js"></script>
    <script src="js/datos.js"></script>

    <script>
        // ── FUNCIÓN DE LOGIN ──────────────────────────────────────────
        // Busca el usuario en localStorage comparando email y contraseña
        async function iniciarSesion(evento) {
            evento.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // Asegurarse de que los usuarios estén cargados en localStorage
            await cargarUsuarios();
            const usuarios = leer('usuarios') || [];

            // Buscar el usuario que coincida con email y contraseña
            const usuarioEncontrado = usuarios.find(u =>
                u.email === email && u.password === password
            );

            if (!usuarioEncontrado) {
                // No encontrado: mostrar error con SweetAlert2
                Swal.fire({
                    title: 'Credenciales incorrectas',
                    text: 'El correo o la contraseña no son válidos. Verifica tus datos.',
                    icon: 'error',
                    confirmButtonColor: '#00439c'
                });
                return;
            }

            // Guardar el usuario activo en localStorage
            guardar('usuarioActivo', usuarioEncontrado);

            // Notificación de éxito con Toastify
            Toastify({
                text: `✅ Bienvenido, ${usuarioEncontrado.nombres}!`,
                duration: 3000,
                gravity: 'top',
                position: 'right',
                backgroundColor: '#00439c'
            }).showToast();

            // Redirigir al inicio después de 1.2 segundos
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        }
    </script>
</body>

</html>
