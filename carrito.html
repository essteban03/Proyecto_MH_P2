<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Mi Carrito - Matador House</title> 
    <link rel="stylesheet" href="css/general.css">
</head>
<body>
    
    <header>
        <div>
            <h1>Matador House</h1>
        </div>
        <nav>
            <a href="index.html">&larr; Volver a la Tienda</a>
        </nav>
    </header>
    
    <main>
        <h2>Tu Carrito de Compras</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Juego</th>
                    <th>Plataforma</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Marvel's Spider-Man 2</td>
                    <td>PS5</td>
                    <td>$59.99</td>
                </tr>
                <tr>
                    <td>Ghost of Tsushima</td>
                    <td>PS5</td>
                    <td>$69.99</td>
                </tr>
                <tr>
                    <td colspan="2">TOTAL A PAGAR:</td>
                    <td>$129.98</td>
                </tr>
            </tbody>
        </table>

        <h2>Detalles de Pago</h2>
        <form action="exito.html" method="GET">
            <fieldset>
                <legend>Tarjeta de Crédito / Débito</legend>
                
                <label>Nombre en la tarjeta:
                    <input type="text" name="titular" required>
                </label>

                <label>Número de tarjeta:
                    <input type="number" name="tarjeta" placeholder="1234 5678 9012 3456" required>
                </label>

                <label>Mes de Vencimiento:
                    <input type="date" name="vencimiento" required>
                </label>

                <label>Código CVV:
                    <input type="password" name="cvv" maxlength="3" required placeholder="123">
                </label>
            </fieldset>

            <div>
                <input type="submit" value="Confirmar Pago de $129.98">
            </div>
        </form>
    </main>

    <footer>
        <p>Matador House</p>
        <p>© 2026 Todos los derechos reservados.</p>
    </footer>
</body>
</html>
