<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Registro - Matador House</title> 
    <link rel="stylesheet" href="css/general.css">
</head>
<body>
    
    <header>
        <div>
            <h1>Matador House</h1>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Crear Cuenta</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    
    <main>
        <h2>Crea tu cuenta de Jugador</h2>
        <p>Únete a Matador House para gestionar tus compras.</p>
        
        <form action="login.html" method="POST">
            <fieldset>
                <legend>Tus Datos Personales</legend>
                
                <label>Nombre completo:
                    <input type="text" name="nombre" required>
                </label>
                
                <label>Correo electrónico:
                    <input type="email" name="email" required>
                </label>

                <label>Contraseña:
                    <input type="password" name="pass" required>
                </label>

                <label>Fecha de Nacimiento:
                    <input type="date" name="fecha_nac" required>
                </label>
            </fieldset>

            <fieldset>
                <legend>Preferencias de Consola</legend>
                <p>¿Qué consola utilizas principalmente?</p>
                
                <label>
                    <input type="radio" name="consola" value="PS4"> PlayStation 4
                </label>
                
                <label>
                    <input type="radio" name="consola" value="PS5" checked> PlayStation 5
                </label>
            </fieldset>

            <fieldset>
                <legend>Términos y Condiciones</legend>
                
                <label>
                    <input type="checkbox" name="terms" required> Acepto los términos y condiciones de la tienda.
                </label>

                <label>
                    <input type="checkbox" name="promo"> Quiero recibir ofertas de PS Plus en mi correo.
                </label>
            </fieldset>

            <div>
                <input type="submit" value="Completar Registro">
                <input type="reset" value="Limpiar">
            </div>
        </form>
    </main>

    <footer>
        <p>Matador House</p>
        <p>© 2026 Todos los derechos reservados.</p>
    </footer>
</body>
</html>
